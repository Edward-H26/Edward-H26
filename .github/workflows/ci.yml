name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Render the static cards and the README blocks
        run: npm run render
      # The committed README and assets must match what the data renders; otherwise `npm run render`
      # was skipped after an edit to scripts/data or scripts/cards.
      - name: Fail when the README or an asset is stale
        run: git diff --exit-code -- README.md assets
